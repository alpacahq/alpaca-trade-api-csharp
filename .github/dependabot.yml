version: 2
updates:

  # Maintain dependencies for NuGet packages.
  # Discovery from "/" follows Alpaca.Markets.sln, so every project in the
  # solution is included. group-by then opens one pull request per package
  # across those projects.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
    open-pull-requests-limit: 10
    assignees:
      - carlostasada
    ignore:
      # Odd majors are STS (.NET 11, 13, 15). Keep 10.0.x patches and the next LTS.
      # NuGet parses "11.*" as the exact version 11.0, which does not match 11.0.0.
      - dependency-name: "Microsoft.Extensions.*"
        versions: [">=11.0.0,<12.0.0", ">=13.0.0,<14.0.0", ">=15.0.0,<16.0.0"]
      - dependency-name: "System.*"
        versions: [">=11.0.0,<12.0.0", ">=13.0.0,<14.0.0", ">=15.0.0,<16.0.0"]
    groups:
      # First match wins. group-by opens one pull request per package name
      # across the projects discovered above. A System.* or
      # Microsoft.Extensions.* update that falls outside these update-types
      # is still grouped by the catch-all, so a minor or major does not split
      # back into per-project pull requests.
      dotnet-system:
        patterns:
          - "System.*"
        group-by: "dependency-name"
        update-types:
          - "patch"
      dotnet-extensions:
        patterns:
          - "Microsoft.Extensions.*"
        group-by: "dependency-name"
        update-types:
          - "patch"
          - "minor"
      nuget:
        patterns:
          - "*"
        group-by: "dependency-name"

  # Maintain the .NET SDK version in global.json
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - carlostasada
    ignore:
      # Odd majors are STS (.NET 11, 13, 15). Keep 10.0.x patches and the next LTS.
      # The same ranges as NuGet, so an 11.0.x SDK is ignored and 12.0.x is not.
      - dependency-name: "*"
        versions: [">=11.0.0,<12.0.0", ">=13.0.0,<14.0.0", ">=15.0.0,<16.0.0"]

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    assignees:
      - carlostasada

