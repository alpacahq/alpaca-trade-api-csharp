name: Update NuGet Lock Files

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - global.json
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'

permissions:
  contents: write

jobs:
  lockfiles:
    name: Update and Commit
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.ref }}

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore Dependencies
      run: |
        set +e
        dotnet restore --force-evaluate /p:RestoreLockedMode=false /p:NuGetAudit=false > restore.log 2>&1
        status=$?
        set -e
        cat restore.log
        if [ "$status" -ne 0 ]; then
          python3 .github/scripts/test_align_nuget_downgrades.py
          python3 .github/scripts/align_nuget_downgrades.py restore.log
          dotnet restore --force-evaluate /p:RestoreLockedMode=false /p:NuGetAudit=false
        fi

    - name: Auto-commit changed files
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: Update NuGet lock files after Dependabot dependency update.
        file_pattern: |
          **/*.csproj
          **/packages.lock.json
