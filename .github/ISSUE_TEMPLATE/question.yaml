name: ❓ Question about the SDK
description: Ask about the Alpaca C#/.NET SDK after checking the documentation
title: "[Question]: "
labels: [question]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Ask SDK-specific questions here in English. General API questions go to the [Community Forum](https://forum.alpaca.markets/) or [Slack](https://alpaca.markets/slack), and API bugs go to [alpacahq/alpaca-api](https://github.com/alpacahq/alpaca-api/issues/new/choose). Questions about your account, funding, or orders go to a [support request](https://alpaca.markets/support/request).

        Never include API keys, account details, request or trace IDs, or other secrets.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched the documentation and existing issues.
          required: true
        - label: My question has to do with this SDK and is not a general question about the API. General API questions go to the Community Forum or Slack, and API bugs go to alpacahq/alpaca-api.
          required: true
        - label: My question is not asking for a trading strategy, algorithm design, or investment advice.
          required: true

  - type: input
    id: sdk_version
    attributes:
      label: SDK version
      description: Provide the installed package and version when the question concerns observed behavior.
      placeholder: Alpaca.Markets 8.0.1, or Not applicable

  - type: input
    id: environment
    attributes:
      label: .NET and environment context
      description: Include the target framework, .NET version, OS, architecture, and affected package when relevant.
      placeholder: net10.0 on macOS arm64 using Alpaca.Markets, or Not applicable

  - type: textarea
    id: question
    attributes:
      label: Question
      description: Explain what you are trying to accomplish and what you already tried.
    validations:
      required: true

  - type: checkboxes
    id: sensitive_data
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed API keys, credentials, account details, request or trace IDs, and other secrets.
          required: true
